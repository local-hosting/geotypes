# Slug overrides + archetype defaults (category defaults → data/category/*.yml).
# Regenerate: yarn sync:place-archetypes
#
# Three axes → one archetype: spec/doc/place/place-archetypes.md
# extent:   slug override → geometry (point → footprint, linestring → route,
#           polygon → category extent)
# vertical: slug override → category vertical (footprint / site only) → flat
# movement: slug override → sequenced for route, else free
#
# Decorations (spec/doc/place/decorate-twin.md):
# situations: slug override (replaces) → category situations → none
# layers:     archetype_layers ∪ category layers ∪ slug layers
#
# Building imports (RFC 0005): when true for resolved archetype, twin init writes place/BUILDINGS.md.
suggest_building_import:
  campus: true
# Each place slug's axes, archetype, and decorations are materialized on GEOTYPE_LAYOUT_META_BY_SLUG;
# `assets:` slugs are excluded (GEOTYPE_ASSET_SLUGS).
# Golden `from:` bases and `with:` mixins: examples (base-*, mixin-*).
# Overrides or assets for slugs missing from features.yml fail the sync.

archetype_defaults:
  indoor_stack:
    linear_unit: m
    h3_resolution: 10
    space_granularity: room
  single_level:
    linear_unit: m
    h3_resolution: 10
    space_granularity: room
  campus:
    linear_unit: m
    h3_resolution: 9
    space_granularity: zone
  open_area:
    linear_unit: m
    h3_resolution: 9
    space_granularity: zone
  linear:
    linear_unit: m
    h3_resolution: 9
    space_granularity: zone

# Decoration layers each archetype typically adds on top of its golden base.
# visits = optional visit moments (layout TOC); not suggested for indoor_stack footprints.
archetype_layers:
  single_level: []
  indoor_stack: []
  campus: [routes, visits]
  open_area: [routes]
  linear: [visits]

# Situation units in @twinfile/simulator situations/ (decorators wired via plans/).
situations:
  - severe-weather
  - transit-disruption
  - dam-release
  - litter-pollution
  - flood
  - earthquake
  - wildfire
  - tsunami
  - volcanic-ash
  - drought
  - power-outage
  - slope-movement
  - field-damage

# Point assets with no interior (signs, hydrants, poles, meters, wells, towers).
# Not places: excluded from GEOTYPE_LAYOUT_META_BY_SLUG; use them as `assets.yaml` kinds.
assets:
  - atm
  - capacitor
  - cell_tower
  - charging_station
  - emergency_siren
  - fiber_node
  - field_observation_point
  - fire_hydrant
  - gas_meter
  - junction_box
  - manhole_cover
  - oil_gas_well
  - power_line_tower
  - production_well
  - radio_tower
  - regulator
  - spring
  - stop_sign
  - switch_gear
  - traffic_light
  - transformer
  - utility_meter
  - utility_pole
  - valve
  - water_tower
  - water_well
  - yield_sign

